name: Kingdom performance regressions
on:
  push:
    branches: [dev]
    paths: ['src/**', 'package.json', 'package-lock.json', 'tsconfig*.json', '.github/workflows/performance-pass.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kingdom-performance-regressions
  cancel-in-progress: true
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check for new TypeScript errors against the pre-performance baseline
        run: |
          baseline="$RUNNER_TEMP/kingdom-types-baseline"
          git worktree add --detach "$baseline" 594fd2c6623082fb45e5ff30ed58569974ea4378
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          (cd "$baseline"; "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --pretty false) > /tmp/kingdom-before.txt 2>&1 || true
          npx tsc --pretty false > /tmp/kingdom-after.txt 2>&1 || true
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          def errors(p):
              return Counter(re.sub(r'\(\d+,\d+\)', '(location)', s) for s in Path(p).read_text().splitlines() if s.strip())
          extra = errors('/tmp/kingdom-after.txt') - errors('/tmp/kingdom-before.txt')
          for s in extra.elements():
              print('::error::' + s)
          if extra:
              raise SystemExit(1)
          print('No new TypeScript diagnostics. Pre-existing errors remain outside this performance pass.')
          PY
      - name: Build dev
        env:
          VITE_CHANNEL: dev
        run: npx vite build
      - name: Run isolated performance regressions
        run: |
          cat > /tmp/kingdom-performance-tests.cjs <<'JS'
          const fs = require('node:fs'), vm = require('node:vm'), assert = require('node:assert/strict'), ts = require('typescript');
          const phaser = { Scene: class {} };
          function load(path, imports) {
            const out = ts.transpileModule(fs.readFileSync(path, 'utf8'), { compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2020 } }).outputText;
            const exports = {};
            vm.runInNewContext(out, { exports, console, performance, require: (id) => (id === 'phaser' ? { default: imports[id] } : imports[id]) || {} }, { filename: path });
            return exports;
          }
          const { terrainResolution } = load('src/scenes/mapArt.ts', { phaser });
          let resolution = 1;
          for (const z of [0.66, 0.64, 0.66, 0.59]) resolution = terrainResolution(resolution, z);
          assert.equal(resolution, 1);
          resolution = terrainResolution(resolution, 0.57);
          assert.equal(resolution, 0.5);
          for (const z of [0.64, 0.66, 0.71]) resolution = terrainResolution(resolution, z);
          assert.equal(resolution, 0.5);
          assert.equal(terrainResolution(resolution, 0.73), 1);
          assert.equal(terrainResolution(1, 0.58), 1);
          assert.equal(terrainResolution(0.5, 0.72), 0.5);
          const { CityScene } = load('src/scenes/CityScene.ts', { phaser, './cityArt': { ART: 16, CASTLE_ART: { w: 4, h: 4 } } });
          const scene = Object.create(CityScene.prototype);
          CityScene.instance = scene;
          Object.assign(scene, { ready: true, sys: { isActive: () => true }, cameras: { main: { zoom: 1 } }, bigLabels: true, labels: [] });
          let draws = 0;
          scene.redraw = () => draws++;
          CityScene.refresh(); CityScene.refresh(); CityScene.refresh();
          assert.equal(draws, 0);
          scene.update(); assert.equal(draws, 1);
          scene.update(); assert.equal(draws, 1);
          scene.sys.isActive = () => false;
          CityScene.refresh(); scene.update(); assert.equal(draws, 1);
          const lay = { cells: new Map(), hexes: [], outside: [], byIndex: new Map() };
          const c = { owner: 0, walls: 0, pop: 0, buildings: [], sites: {}, project: null, projectSite: null, projectTurns: 0, deco: [] };
          const state = { isSimple: () => true, cityNames: {}, players: [{ name: 'Test', color: 1 }], isCoastal: () => false };
          let pick = 'keep', decoUI = null, staticDraws = 0, overlays = 0;
          const link = { state, city: c, me: 0, sel: () => pick, deco: () => decoUI };
          const { CityScene: CachedCity } = load('src/scenes/CityScene.ts', {
            phaser,
            '../world/grid': { cityLayout: () => lay, cellKey: (x, y) => `${x},${y}` },
            '../world/city': { freeSlots: () => 1 },
            '../world/tile': { BUILDING_ORDER: [] },
            '../world/deco': { isPathKind: (k) => k === 99 },
            './citySprites': { keepPeople: () => [] },
            './cityArt': { ART: 16, GRASS: { plain: 0, tufts: 1, flowers: 2 }, CASTLE_ART: { w: 4, h: 4, cells: [] }, canDraw: () => false, hasFrame: () => false }
          });
          const cached = Object.create(CachedCity.prototype);
          CachedCity.link = link;
          let gfx;
          gfx = new Proxy({}, { get: () => () => gfx });
          Object.assign(cached, { ready: true, paintedLayout: null, paintedStamp: '', blit: { ground: {}, obj: {} }, labels: [], texts: [], people: [], ground: gfx, hillG: gfx, scenery: gfx, marks: gfx, gridG: gfx, selG: gfx, bonusG: gfx, moving: null });
          cached.drawOutside = cached.drawLife = cached.crowd = cached.drawBorders = () => {};
          cached.drawTown = () => staticDraws++;
          cached.txt = () => { cached.nText++; return gfx; };
          const realOverlay = cached.redrawSelection;
          cached.redrawSelection = function(...args) { overlays++; return realOverlay.apply(this, args); };
          cached.redraw(); cached.redraw();
          assert.equal(staticDraws, 1);
          assert.equal(overlays, 2);
          pick = 123; cached.redraw(); assert.equal(staticDraws, 1);
          c.deco.push([1, 1, 0]); cached.redraw(); assert.equal(staticDraws, 2);
          decoUI = { tool: 0, picked: null }; cached.redraw(); assert.equal(staticDraws, 3);
          decoUI = { tool: 1, picked: null }; cached.redraw(); assert.equal(staticDraws, 3);
          decoUI = { tool: 99, picked: null }; cached.redraw(); assert.equal(staticDraws, 4);
          let saves = 0, panelRefreshes = 0;
          const { MapScene } = load('src/scenes/MapScene.ts', { phaser, '../world/save': { saveGame: () => saves++ } });
          const map = Object.create(MapScene.prototype);
          map.state = {};
          map.cityView = { visible: true, refresh: () => panelRefreshes++ };
          map.redraw(false); assert.equal(saves, 0);
          map.redraw(true); assert.equal(saves, 1);
          assert.equal(panelRefreshes, 2);
          const source = fs.readFileSync('src/scenes/MapScene.ts', 'utf8');
          assert.match(source, /this\.redraw\(acted\)/);
          assert.match(source, /state\.perform\('claim'.*\{ acted = true; break; \}/);
          assert.match(fs.readFileSync('src/scenes/CityScene.ts', 'utf8'), /this\.moving\.to = t;\s+this\.refreshPending = true;/);
          console.log('PASS: zoom hysteresis, coalesced refresh, selection cache, decoration/grid invalidation, queued drag previews, sleeping-map save gate.');
          JS
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "try { require('/tmp/kingdom-performance-tests.cjs'); } catch(e) { console.log('::error::' + String(e.stack).replace(/\n/g, '%0A')); process.exit(1); }"
