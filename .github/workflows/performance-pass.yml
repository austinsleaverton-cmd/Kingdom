name: Validate Kingdom performance pass
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/performance-pass.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record compiler baseline
        run: npx tsc --pretty false > /tmp/kingdom-before.txt 2>&1 || true
      - name: Tighten decoration redraw invalidation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/scenes/CityScene.ts')
          s = p.read_text()
          def change(old, new):
              global s
              if old in s:
                  assert s.count(old) == 1
                  s = s.replace(old, new)
              else:
                  assert new in s
          change('link.me, !!ui, c.owner, c.walls', 'link.me, !!ui, paints(ui), c.owner, c.walls')
          change('this.moving.to = t;\n              this.redraw();', 'this.moving.to = t;\n              this.refreshPending = true;')
          p.write_text(s)
      - name: Reject new compiler errors
        run: |
          npx tsc --pretty false > /tmp/kingdom-after.txt 2>&1 || true
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          def errors(p):
              return Counter(re.sub(r'\(\d+,\d+\)', '(location)', s) for s in Path(p).read_text().splitlines() if s.strip())
          extra = errors('/tmp/kingdom-after.txt') - errors('/tmp/kingdom-before.txt')
          for s in extra.elements():
              print('::error::' + s)
          assert not extra
          PY
      - name: Build dev
        env:
          VITE_CHANNEL: dev
        run: npx vite build
      - name: Run performance regressions
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          seed = subprocess.check_output(['git', 'show', 'c2dbf14273456992bfd04adafeb58a5857fb5227:.github/workflows/performance-pass.yml'], text=True)
          tests = seed.split("          cat > /tmp/kingdom-performance-tests.cjs <<'JS'\n", 1)[1].split('\n          JS', 1)[0]
          tests = '\n'.join(s[10:] if s.startswith('          ') else s for s in tests.splitlines())
          tests = tests.replace('isPathKind: () => false', 'isPathKind: (k) => k === 99')
          tests += '\ndecoUI = { tool: 99, picked: null }; cached.redraw(); assert.equal(staticDraws, 4);\nassert.match(fs.readFileSync("src/scenes/CityScene.ts", "utf8"), /this\\.moving\\.to = t;\\s+this\\.refreshPending = true;/);\nconsole.log("PASS: paint-tool grid invalidation and queued drag preview.");\n'
          Path('/tmp/kingdom-performance-tests.cjs').write_text(tests)
          PY
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "try { require('/tmp/kingdom-performance-tests.cjs'); } catch(e) { console.log('::error::' + String(e.stack).replace(/\n/g, '%0A')); process.exit(1); }"
      - name: Commit validated refinement to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scenes/CityScene.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Invalidate paint-grid emphasis and batch decoration drag previews'
            git push origin HEAD:dev
          fi
