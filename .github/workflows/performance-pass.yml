name: Validate Kingdom performance pass
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/performance-pass.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kingdom-performance-pass
  cancel-in-progress: false
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record baseline compiler diagnostics
        run: npx tsc --pretty false > /tmp/kingdom-before.txt 2>&1 || true
      - name: Apply guarded source patch and prepare tests
        shell: python
        run: |
          import subprocess
          seed = subprocess.check_output(['git', 'show', 'e82c3ee552d52efd61eb42b5da4e8c6202f30d0f:.github/workflows/performance-pass.yml'], text=True)
          block = seed.split('        shell: python\n        run: |\n', 1)[1].split('      - name:', 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          code = code.replace("'../world/grid': { cityLayout: () => lay },", "'../world/grid': { cityLayout: () => lay, cellKey: (x, y) => `${x},${y}` }, './citySprites': { keepPeople: () => [] }, '../world/deco': { isPathKind: () => false },")
          code = code.replace('ART: 16, CASTLE_ART: { w: 4, h: 4, cells: [] }', 'ART: 16, GRASS: { plain: 0, tufts: 1, flowers: 2 }, CASTLE_ART: { w: 4, h: 4, cells: [] }')
          exec(compile(code, '<validated patch and isolated test preparation>', 'exec'))
      - name: Reject new TypeScript diagnostics
        run: |
          npx tsc --pretty false > /tmp/kingdom-after.txt 2>&1 || true
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          def diagnostics(path):
              return Counter(re.sub(r'\(\d+,\d+\)', '(location)', line) for line in Path(path).read_text().splitlines() if line.strip())
          extra = diagnostics('/tmp/kingdom-after.txt') - diagnostics('/tmp/kingdom-before.txt')
          for line in extra.elements():
              print('::error::' + line)
          if extra:
              raise SystemExit(1)
          print('No new TypeScript diagnostics.')
          PY
      - name: Build dev
        env:
          VITE_CHANNEL: dev
        run: npx vite build
      - name: Run regression tests
        run: |
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "try { require('/tmp/kingdom-performance-tests.cjs'); } catch(e) { console.log('::error::' + String(e.stack).replace(/\n/g, '%0A')); process.exit(1); }"
      - name: Commit validated source changes to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scenes/CityScene.ts src/scenes/MapScene.ts src/scenes/mapArt.ts
          if git diff --cached --quiet; then
            echo 'Performance changes already applied; validation passed.'
          else
            git commit -m 'Reduce city repaint work, skip selection saves, and stabilize terrain zoom resolution'
            git push origin HEAD:dev
          fi
