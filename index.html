<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No browser zoom: the game handles pinch-to-zoom itself. viewport-fit=cover: draw under the notch (UI is padded by safe areas) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kingdom</title>
    <!-- Install as an app (PWA) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b1a2e" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kingdom" />
    <style>
      /* Pin the page so iOS can't leave it scrolled after rotating (that shifts where taps land) */
      html,
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1a2e;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }

      input {
        -webkit-user-select: text;
        user-select: text;
      }

      #game {
        position: fixed;
        inset: 0;
      }

      #game,
      canvas {
        display: block;
        touch-action: none;
      }

      /* Keep the menus and panels clear of the notch / home bar */
      .k-hud {
        top: env(safe-area-inset-top) !important;
        right: env(safe-area-inset-right) !important;
        bottom: env(safe-area-inset-bottom) !important;
        left: env(safe-area-inset-left) !important;
      }
      .k-menu {
        padding-top: max(8px, env(safe-area-inset-top)) !important;
        padding-right: env(safe-area-inset-right) !important;
        padding-bottom: max(8px, env(safe-area-inset-bottom)) !important;
        padding-left: env(safe-area-inset-left) !important;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
